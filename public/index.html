<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maple Freight Triage</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div>
      <h1>What needs Maple Freight today</h1>
      <p class="sub" id="asof"></p>
    </div>
    <div class="who">
      <span class="who-label">Signed in as</span>
      <div class="segmented" id="userSeg" role="tablist" aria-label="Signed-in user"></div>
    </div>
  </div>
  <nav class="bar-inner tabs">
    <div class="segmented" id="tabSeg" role="tablist" aria-label="Sections"></div>
  </nav>
</header>

<main>
  <section class="metrics" id="metrics" aria-label="Metrics"></section>
  <details class="quality" id="quality"></details>
  <section id="view"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
